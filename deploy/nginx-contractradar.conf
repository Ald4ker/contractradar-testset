# nginx vhost for the ContractRadar test set on a new host. certbot --nginx -d contractradar.opentransformers.online adds
# TLS. The locations live in a snippet that deploy.sh keeps up to date (deploy/nginx-contractradar-locations.conf).
server {
    listen 80;
    listen [::]:80;
    server_name contractradar.opentransformers.online;

    root /var/www/contractradar-testset/site/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain text/markdown;
    gzip_min_length 512;

    include /etc/nginx/snippets/contractradar-locations.conf;
}
