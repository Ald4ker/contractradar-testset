# nginx vhost for the static test-set site. Served from the git checkout's site/dist.
# certbot --nginx -d contractradar.opentransformers.online adds the TLS block.
server {
    listen 80;
    listen [::]:80;
    server_name contractradar.opentransformers.online;

    root /var/www/contractradar-testset/site/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain text/markdown;
    gzip_min_length 512;

    location ~* \.(png|pdf|zip)$ { expires 1d; add_header Cache-Control "public"; }
    location ~* \.(json|csv|md)$ { expires 5m; add_header Access-Control-Allow-Origin "*"; }
    location / { try_files $uri $uri/ =404; }
}
