# Locations for the ContractRadar site: the MCP server and submission API (crtest.server on 127.0.0.1:8765) and the
# static files. Included once from the TLS server block (certbot owns that file); deploy.sh reinstalls this snippet to
# /etc/nginx/snippets/contractradar-locations.conf on every run, so location changes reach the live host.
# Needs the limit_req zone from nginx-contractradar-ratelimit.conf (in /etc/nginx/conf.d/).
location ^~ /api/ {
    limit_req zone=contractradar_api burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 300k;
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
location = /mcp {
    limit_req zone=contractradar_api burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 300k;
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
}
location ^~ /_preview/ { return 404; }
location ~* \.(png|pdf|zip)$ { expires 1d; add_header Cache-Control "public"; add_header X-Content-Type-Options "nosniff" always; }
location ~* \.(json|csv|md|txt)$ { expires 5m; add_header Access-Control-Allow-Origin "*"; add_header X-Content-Type-Options "nosniff" always; }
location / { try_files $uri $uri/ =404; }
